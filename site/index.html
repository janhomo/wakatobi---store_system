<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2226">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>QR Aset Gudang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script>try{var t=JSON.parse(localStorage.getItem('qrg.theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* Tampilan v3: header gelap dengan menu samping, daftar per jenis, navigasi bawah dengan tombol Scan di tengah.
   Warna: abu beton hangat + biru baja; hijau/kuning/merah hanya untuk kondisi dan hasil scan. */
:root{
  --bg:#F1F0EC; --surface:#FFFFFF; --ink:#1B2226; --muted:#5C686E; --line:#D8D7D0;
  --accent:#1F5F8B; --accent-ink:#FFFFFF; --accent-soft:#E3EEF6; --thumb:#DCE6EC; --thumb-ink:#4F6F80;
  --ok:#1B6F44; --ok-bg:#DBF0E3; --warn:#85560A; --warn-bg:#FAEAC6; --bad:#A3221A; --bad-bg:#F8D9D5; --unk:#55616A; --unk-bg:#E5E5DF;
  --hdr:#1B2226; --hdr-ink:#FFFFFF; --hdr-sub:#C3CDD2;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13181B; --surface:#1C2226; --ink:#E7EBED; --muted:#9BA7AD; --line:#313A40;
    --accent:#7FB9E4; --accent-ink:#0D1D29; --accent-soft:#1F3040; --thumb:#26323A; --thumb-ink:#8FB0C2;
    --ok:#74D3A0; --ok-bg:#173A2A; --warn:#F0C468; --warn-bg:#3A2D10; --bad:#FF9D93; --bad-bg:#44211E; --unk:#A8B2B7; --unk-bg:#293136;
    --hdr:#0B0F11;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#13181B; --surface:#1C2226; --ink:#E7EBED; --muted:#9BA7AD; --line:#313A40;
    --accent:#7FB9E4; --accent-ink:#0D1D29; --accent-soft:#1F3040; --thumb:#26323A; --thumb-ink:#8FB0C2;
    --ok:#74D3A0; --ok-bg:#173A2A; --warn:#F0C468; --warn-bg:#3A2D10; --bad:#FF9D93; --bad-bg:#44211E; --unk:#A8B2B7; --unk-bg:#293136;
    --hdr:#0B0F11;
    color-scheme:dark;
}
.brand.dk{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand.lt{display:none} :root:not([data-theme="light"]) .brand.dk{display:block}}
:root[data-theme="dark"] .brand.lt{display:none}
:root[data-theme="dark"] .brand.dk{display:block}
:root[data-theme="light"] .brand.lt{display:block}
:root[data-theme="light"] .brand.dk{display:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
[hidden]{display:none!important}
svg{flex-shrink:0}

/* ---- header ---- */
.top{position:sticky; top:0; z-index:30; background:var(--hdr); color:var(--hdr-ink); padding-top:env(safe-area-inset-top, 0px)}
.top .in{max-width:640px; margin:0 auto; height:64px; display:flex; align-items:center; gap:6px; padding:0 8px}
.hbtn{width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:none; border:0; color:inherit; flex-shrink:0; border-radius:10px}
.htitle{min-width:0; flex-grow:1}
.htitle b{display:block; font-family:var(--f-display); font-weight:700; font-size:23px; letter-spacing:.03em; text-transform:uppercase; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.htitle small{display:block; font-size:12px; color:var(--hdr-sub); line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.syncbar{background:var(--warn-bg); color:var(--warn); font-size:13px; font-weight:600; text-align:center; padding:4px 12px}
.wrap{max-width:640px; margin:0 auto; padding:12px 16px calc(120px + env(safe-area-inset-bottom, 0px))}
.wrap.nonav{padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px))}

/* ---- navigasi bawah ---- */
.bnav{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px)}
.bnav .in{max-width:640px; margin:0 auto; height:78px; display:flex; align-items:flex-start; padding-top:6px}
.bnav a{flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--muted); text-decoration:none; font-size:14px; font-weight:600; position:relative}
.bnav a[aria-current="page"]{color:var(--accent); font-weight:700}
.bnav .mid{flex:1; display:flex; justify-content:center}
.scanfab{width:68px; height:68px; margin-top:-26px; border-radius:34px; background:var(--accent); color:var(--accent-ink); border:5px solid var(--bg); display:flex; align-items:center; justify-content:center}
.bnav .badge{position:absolute; top:2px; left:calc(50% + 6px); min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--bad); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center}
.bnav .badge.soft{background:var(--warn); color:#fff}
.fab{position:fixed; right:max(16px, calc(50% - 304px)); bottom:calc(98px + env(safe-area-inset-bottom, 0px)); z-index:24; min-height:56px; padding:0 20px; border-radius:28px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; gap:8px; border:0; font-size:17px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.3)}

/* ---- umum ---- */
.stats{color:var(--muted); font-size:14px; margin:0 0 10px}
.field{width:100%; min-height:48px; padding:10px 12px; background:var(--surface); border:1.5px solid var(--line); border-radius:10px}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:84px; resize:vertical}
label.lbl{display:block; font-size:14px; color:var(--muted); margin:0 0 4px}
.stack{display:flex; flex-direction:column; gap:10px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:420px){.two.stk{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.code{font-family:var(--f-mono); font-weight:500; font-size:14px; letter-spacing:.02em}
.btn{min-height:52px; padding:10px 16px; border-radius:10px; border:0; background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:17px; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:8px; text-align:center}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.ghost{background:none; border:1.5px solid var(--accent); color:var(--accent)}
.btn.danger{background:var(--bad); color:#fff}
.btn.small{min-height:44px; font-size:15px}
.btn.redo{border-color:var(--bad); color:var(--bad)}
.btn.block{width:100%}
.dashed{min-height:50px; border-radius:10px; border:2px dashed var(--accent); background:none; color:var(--accent); display:flex; align-items:center; justify-content:center; gap:8px; font-size:16px; font-weight:700; width:100%; text-decoration:none}
.note{margin:0; padding:9px 12px; border-radius:8px; font-size:15px}
.note.warn{background:var(--warn-bg); color:var(--warn)}
.note.bad{background:var(--bad-bg); color:var(--bad)}
.note.info{background:var(--accent-soft); color:var(--ink)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px}
.dkpi{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:4px}
.kpi{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:2px}
.kpi b{font-family:var(--f-display); font-size:32px; line-height:1; color:var(--ink)}
.kpi small{font-size:13px; font-weight:600; color:var(--muted)}
.kpi .s{font-size:12px; color:var(--muted)}
.kpi.bad{border-left-color:var(--bad)} .kpi.bad b{color:var(--bad)}
.kpi.warn{border-left-color:var(--warn)} .kpi.warn b{color:var(--warn)}
.kpi.info{border-left-color:var(--accent)}
@media (min-width:640px){.dkpi{grid-template-columns:repeat(3, 1fr)}}
.card h3{margin:0 0 10px; font-family:var(--f-display); font-weight:700; font-size:22px; letter-spacing:.03em; text-transform:uppercase}
.card h4{margin:14px 0 8px; font-size:15px}
.h2{font-family:var(--f-display); font-weight:700; font-size:22px; letter-spacing:.03em; text-transform:uppercase; margin:18px 0 8px}
.empty{padding:28px 8px; text-align:center; color:var(--muted)}
.pill{display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.warn,.pill.out{background:var(--warn-bg); color:var(--warn)}
.pill.bad,.pill.late{background:var(--bad-bg); color:var(--bad)}
.pill.unk{background:var(--unk-bg); color:var(--unk)}
.pill.rak{background:var(--accent-soft); color:var(--accent)}
.pills{display:flex; gap:5px; flex-wrap:wrap}
.x{min-width:44px; min-height:44px; background:none; border:0; color:var(--muted); font-size:20px; line-height:1}
.x.confirm{color:var(--bad); font-size:14px; font-weight:600}
details summary{cursor:pointer; min-height:44px; display:flex; align-items:center; font-weight:600}

/* ---- daftar jenis ---- */
.fchips{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin:0 0 10px; scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{min-height:36px; padding:0 14px; border-radius:99px; background:var(--surface); border:1px solid var(--line); color:var(--ink); font-size:14px; font-weight:600; white-space:nowrap; flex-shrink:0}
.fchip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.jlist{display:flex; flex-direction:column; gap:8px}
.jcard{width:100%; display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--line); text-align:left}
.jcard:hover{border-color:var(--accent)}
.thumb{width:64px; height:64px; border-radius:8px; background:var(--thumb); color:var(--thumb-ink); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden}
.thumb img{width:100%; height:100%; object-fit:cover}
.jcard .nm{min-width:0; flex-grow:1}
.jcard .nm b{display:block; font-size:18px; font-weight:600; line-height:1.15; overflow-wrap:anywhere}
.jcard .nm small{display:block; font-size:13px; color:var(--muted); overflow-wrap:anywhere}
.jcard .pills{margin-top:5px}

/* ---- detail jenis ---- */
.hero{position:relative; height:220px; border-radius:12px; background:var(--thumb); color:var(--thumb-ink); display:flex; align-items:center; justify-content:center; margin-bottom:10px; overflow:hidden}
.hero img{width:100%; height:100%; object-fit:contain}
.utabs{display:flex; border-bottom:2px solid var(--line); margin-bottom:10px}
.utabs button{flex:1; min-height:46px; background:none; border:0; border-bottom:3px solid transparent; margin-bottom:-2px; font-size:16px; font-weight:600; color:var(--muted)}
.utabs button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:700}
.ucard{padding:10px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:8px; margin-bottom:8px}
.ucard.focus{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent)}
.ucard .l1{display:flex; align-items:center; justify-content:space-between; gap:8px}
.ucard .l1 .code{font-size:18px}
.ucard .l1 .unum{font-size:13px; color:var(--muted); margin-left:8px}
.ucard .l2{font-size:14px; color:var(--muted); overflow-wrap:anywhere}
.ucard .l3{display:flex; gap:8px}
.ubtn{flex:1; min-height:46px; border-radius:10px; border:0; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; background:var(--accent); color:var(--accent-ink)}
.ubtn.ret{background:var(--ok); color:#fff}
.ubtn.off{background:none; border:1.5px solid var(--line); color:var(--muted); cursor:default}
.ubtn.edit{flex:0 0 48px; background:none; border:1.5px solid var(--line); color:var(--ink)}
.chips{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.chips li{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 6px 6px 12px; background:var(--accent-soft); border-radius:8px; min-width:0}
.chips li span{min-width:0; overflow-wrap:anywhere}

/* ---- form ---- */
.kseg{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.kseg button{min-height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-size:14px; font-weight:600; padding:0 4px}
.kseg button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700}
.kseg button.bad[aria-pressed="true"]{border-color:var(--bad); background:var(--bad-bg); color:var(--bad)}
.codeprev{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border-radius:10px; background:var(--accent-soft)}
.codeprev b{font-family:var(--f-mono); font-size:20px}
.pickrow{width:100%; display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:10px; background:var(--surface); border:1.5px solid var(--line); text-align:left; margin-bottom:6px}
.pickrow[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.pickrow .thumb{width:44px; height:44px}
.pickrow .nm{min-width:0; flex-grow:1; font-weight:600; overflow-wrap:anywhere}
.pickrow .nm small{display:block; font-weight:400; color:var(--muted); font-size:13px}
.qrbox{display:flex; flex-direction:column; align-items:center; gap:10px}
.qrbox svg{width:min(220px,100%); height:auto; border:1px solid var(--line); border-radius:4px; background:#fff}

/* ---- maintenance, riwayat, pekerja (dari v2) ---- */
.sumbox{display:grid; grid-template-columns:auto 1fr; gap:4px 16px; align-items:baseline; margin-bottom:12px}
.sumbox .n{font-family:var(--f-display); font-weight:700; font-size:56px; line-height:1; grid-row:span 3}
.sumbox div{font-size:15px}
.mlist{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
.mlist li{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--surface)}
.mlist .top2{display:flex; justify-content:space-between; gap:8px; align-items:center}
.mlist .jenis{font-weight:600}
.mlist .meta{color:var(--muted); font-size:14px}
.mlist p{margin:6px 0 0; font-size:15px; overflow-wrap:anywhere}
.openrow{background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--warn); border-radius:8px; padding:10px 12px; margin-bottom:8px}
.openrow.late{border-left-color:var(--bad)}
.openrow .top2{display:flex; justify-content:space-between; gap:8px; align-items:center}
.openrow .nm{font-weight:600; overflow-wrap:anywhere}
.openrow .meta{color:var(--muted); font-size:14px; margin:2px 0 8px; overflow-wrap:anywhere}
.openrow .btns{display:grid; grid-template-columns:2fr 1fr; gap:8px}
.openrow .btns button{min-height:44px; border-radius:8px; font-weight:600; font-size:15px; border:1.5px solid var(--accent); background:none; color:var(--accent)}
.openrow .btns button.r{border-color:var(--bad); color:var(--bad)}
.big{font-family:var(--f-display); font-weight:700; font-size:22px; letter-spacing:.02em; margin:2px 0 12px}
.grp{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px}
.grp header{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:6px}
.grp h3{margin:0; font-size:18px; overflow-wrap:anywhere}
.grp h3 small{font-weight:400; color:var(--muted); font-size:14px}
.grp ul{list-style:none; margin:0; padding:0}
.grp li{padding:8px 0; border-top:1px solid var(--line); min-width:0}
.grp li .l1{display:flex; gap:10px; align-items:baseline; min-width:0; overflow-wrap:anywhere}
.grp li .l1 a{color:inherit; text-decoration:none; display:flex; gap:10px; align-items:baseline}
.grp li .l2{color:var(--muted); font-size:14px; margin-top:2px}
.grp li .l2 .nb{color:var(--warn); font-weight:600}
.dategrid{display:flex; flex-direction:column; gap:6px}
.daterow2{width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; text-align:left; padding:12px 14px; min-height:56px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.daterow2:hover{border-color:var(--accent)}
.dept{margin:16px 0 6px; font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.logrow{padding:10px 0; border-top:1px solid var(--line); font-size:15px}
.logrow:first-child{border-top:0}
.logrow .w{color:var(--muted); font-size:13px}
.logrow b{font-weight:600}

/* ---- menu samping ---- */
#drawer{position:fixed; inset:0; z-index:55}
#drawer .dbg{position:absolute; inset:0; background:rgba(27,34,38,.58); border:0; width:100%}
#drawer aside{position:absolute; top:0; left:0; bottom:0; width:min(322px,86vw); background:var(--surface); display:flex; flex-direction:column; box-shadow:6px 0 24px rgba(0,0,0,.25); overflow:auto}
#drawer .dh{background:var(--hdr); color:var(--hdr-ink); padding:calc(22px + env(safe-area-inset-top, 0px)) 20px 18px; display:flex; align-items:center; gap:14px}
#drawer .dh .lg{width:48px; height:48px; border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0}
#drawer .dh b{display:block; font-family:var(--f-display); font-weight:700; font-size:25px; letter-spacing:.04em; text-transform:uppercase; line-height:1}
#drawer .dh small{display:block; font-size:13px; color:var(--hdr-sub); margin-top:4px}
#drawer nav{padding:12px 10px; display:flex; flex-direction:column; gap:2px; flex-grow:1}
#drawer .sec{padding:8px 14px 4px; font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
#drawer .it{display:flex; align-items:center; gap:14px; min-height:52px; padding:0 14px; border-radius:10px; background:none; border:0; color:var(--ink); text-decoration:none; font-size:17px; font-weight:600; text-align:left; width:100%}
#drawer .it[aria-current="page"]{background:var(--accent-soft); color:var(--accent)}
#drawer .it.bad{color:var(--bad)}
#drawer .it .cnt{min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--bad); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-left:auto}
#drawer .foot{border-top:1px solid var(--line); padding:8px 10px calc(14px + env(safe-area-inset-bottom, 0px))}
#drawer .foot .it{min-height:48px; font-size:16px; font-weight:500}

#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(100px + env(safe-area-inset-bottom, 0px)); max-width:min(92vw,520px); background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:8px; z-index:95; font-size:15px; box-shadow:0 4px 18px rgba(0,0,0,.25)}

/* ---- login ---- */
#pin{position:fixed; inset:0; z-index:90; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px}
#pin .box{width:min(360px,100%); display:flex; flex-direction:column; gap:12px}
#pin h2{margin:0; font-family:var(--f-display); font-size:32px; text-transform:uppercase; letter-spacing:.03em}
#pin input{font-size:28px; letter-spacing:.3em; text-align:center}

/* ---- scan ---- */
#scan{position:fixed; inset:0; z-index:60; background:#0E1417; display:flex; flex-direction:column; color:#fff}
#scan video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
#scan .dim{position:absolute; inset:0; background:rgba(0,0,0,.3); z-index:1}
#scan .stop{position:relative; z-index:2; display:flex; gap:8px; align-items:center; justify-content:space-between; padding:calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; background:linear-gradient(#000a,#0000)}
#scan .stop button{min-height:44px; padding:6px 14px; border-radius:22px; border:1.5px solid #fff8; background:#0008; color:#fff; font-weight:600; font-size:15px; display:flex; align-items:center; gap:6px}
#scan .mode{display:flex; gap:0; border:1.5px solid #fff8; border-radius:22px; overflow:hidden}
#scan .mode button{border:0; border-radius:0; background:#0008}
#scan .mode button[aria-selected="true"]{background:#fff; color:#000}
#scan .mid{position:relative; z-index:2; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:34px; gap:14px; min-height:0}
#scan .frame{width:min(46vw,200px); aspect-ratio:1; border:4px solid #fffc; border-radius:18px; box-shadow:0 0 0 100vmax #0004; transition:border-color .15s}
#scan .frame.ok{border-color:#3DDC84}
#scan .frame.warn{border-color:#FFC53D}
#scan .frame.bad{border-color:#FF5B4F}
#scan .hint{margin:0; padding:0 24px; text-align:center; color:#E9EDEF; font-size:15px; font-weight:600}
#scan .sheet{position:relative; z-index:3; background:var(--surface); color:var(--ink); border-radius:22px 22px 0 0; padding:10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:10px; max-height:72vh; overflow:auto}
#scan .grab{width:44px; height:4px; border-radius:2px; background:var(--line); margin:0 auto; flex-shrink:0}
#scan .sh-h{display:flex; align-items:center; justify-content:space-between}
#scan .sh-h span.t{font-family:var(--f-display); font-weight:700; font-size:16px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
#scan .sh-h span.n{padding:2px 10px; border-radius:99px; font-size:14px; font-weight:700; background:var(--ink); color:var(--bg)}
#scan .fb{border-radius:10px; padding:10px 12px; font-weight:600; font-size:15px}
#scan .fb.ok{background:var(--ok-bg); color:var(--ok)}
#scan .fb.warn{background:var(--warn-bg); color:var(--warn)}
#scan .fb.bad{background:var(--bad-bg); color:var(--bad)}
#scan .fb.info{background:var(--accent-soft); color:var(--ink)}
.bitem{padding:8px 10px; border-radius:12px; border:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
.bitem.new{border:2px solid #3DDC84}
.bitem .r1{display:flex; gap:12px; align-items:center}
.bitem .thumb{width:52px; height:52px}
.bitem .inf{min-width:0; flex-grow:1}
.bitem .inf b{display:block; font-size:17px; font-weight:600; line-height:1.15; overflow-wrap:anywhere}
.bitem .inf .pills{margin-top:3px}
.namebar{min-height:48px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; gap:8px; padding:0 12px; border:2px solid transparent; font-size:16px; font-weight:700; width:100%; text-align:left}
.namebar.need{border-color:var(--bad); background:var(--bad-bg); color:var(--bad)}
.namebar span.g{flex-grow:1; min-width:0; overflow-wrap:anywhere}
.namebar small{font-weight:400; color:var(--muted); font-size:14px}
.kb{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.kb button{min-height:46px; border-radius:10px; border:2px solid var(--line); background:var(--surface); font-size:16px; font-weight:700}
.kb button[aria-pressed="true"].ok{border-color:var(--ok); background:var(--ok-bg); color:var(--ok)}
.kb button[aria-pressed="true"].bad{border-color:var(--bad); background:var(--bad-bg); color:var(--bad)}
.yn{display:flex; gap:10px}
.yn button{min-height:58px; border-radius:10px; font-weight:700; border:0}
.yn .no{flex:1; background:none; border:1.5px solid var(--accent); color:var(--accent); font-size:17px; font-weight:600}
.yn .yes{flex:2; background:var(--accent); color:var(--accent-ink); font-size:19px}
.yn .yes[disabled]{background:var(--line); color:var(--muted); cursor:not-allowed}
.donebox{border-radius:12px; padding:14px; background:var(--ok-bg); color:var(--ok)}
.donebox b{font-size:18px}
.donebox ul{margin:8px 0 0; padding-left:18px; color:var(--ink)}
#picker{position:fixed; inset:0; z-index:70; background:var(--bg); color:var(--ink); padding:calc(14px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:10px}
#picker h2{margin:0; font-family:var(--f-display); font-size:24px; text-transform:uppercase; letter-spacing:.03em}
#picker .pl{flex:1; overflow:auto}
#picker .row{width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px; min-height:56px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; font-size:18px; font-weight:600; margin-bottom:6px}
#picker .row small{font-weight:400; color:var(--muted); font-size:14px}
#picker .same{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}

#printArea{display:none}
@media print{
  @page{size:A4 landscape; margin:12mm}
  body>*:not(#printArea){display:none!important}
  body{padding:0; background:#fff}
  #printArea{display:block; color:#000; font-family:Arial,Helvetica,sans-serif; font-size:11pt}
  #printArea h1{font-size:16pt; margin:0 0 4px}
  #printArea p{margin:0 0 8px}
  #printArea table{width:100%; border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #000; padding:4px 6px; vertical-align:middle; text-align:left}
  #printArea th{background:#eee}
  #printArea tr{height:10mm}
  #printArea .ttd{width:28mm}
  #printArea .foot{margin-top:10mm; display:flex; justify-content:space-between}
}

/* tambahan */
.kseg{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.skrow{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.xfields{margin:6px 0 0;font-size:13px;color:var(--muted)}
.xfields .xf{margin-right:4px}

/* logo */
.brand{display:block; width:min(240px,72%); height:auto; margin:0 auto 4px}
#drawer .dh{flex-direction:column; align-items:flex-start; gap:10px}
#drawer .dh img{width:168px; height:auto; display:block}
#drawer .dh small{margin-top:0}

/* ---- foto, profil, penyimpanan, material, panduan, impor (langkah 2 sampai 5) ---- */
.thumb.sm{width:44px; height:44px; border-radius:8px}
.thumb.big{width:72px; height:72px}
.thumb.ico{width:56px; height:56px}
.thumb.hph{width:100%; height:100%; border-radius:0; background:transparent}
.hero .herobtn{position:absolute; right:10px; bottom:10px; min-height:40px; padding:0 14px; border-radius:20px; border:0; background:rgba(27,34,38,.82); color:#fff; display:flex; align-items:center; gap:6px; font-size:14px; font-weight:600}
.jcard .nm .code{display:block; font-size:12px; color:var(--muted)}
.namebar.plain{background:var(--surface); color:var(--ink); border:1.5px solid var(--line); font-weight:600}
textarea.field.tall{min-height:160px}
.two1{display:grid; grid-template-columns:1fr auto; gap:8px; margin-bottom:8px}
.ulink{background:none; border:0; padding:0; color:var(--accent); font-weight:600; text-align:left; text-decoration:underline; text-underline-offset:3px; display:inline-flex; align-items:baseline; gap:8px; min-height:32px}
.ucard .l1 .ulink{text-decoration:none; color:var(--ink)}
.lnkbtn{background:none; border:0; padding:0; text-align:left; color:var(--ink); min-width:0}
.warnt{color:var(--warn)!important}
.neg{color:var(--bad); font-weight:700}
.lowt{color:var(--warn); font-weight:700}

/* profil mesin */
.pid{margin:0 0 10px}
.pid h1{margin:2px 0 6px; font-family:var(--f-display); font-weight:700; font-size:30px; letter-spacing:.02em; line-height:1.05; text-transform:uppercase; overflow-wrap:anywhere}
.heldbox{border:2px solid var(--warn); background:var(--warn-bg); border-radius:12px; padding:10px 12px; margin-bottom:10px}
.heldbox .lbl2{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--warn)}
.heldbox .who{margin:2px 0 8px}
.two3{display:grid; grid-template-columns:2fr 1fr; gap:8px}
.ubtn.rus{background:none; border:1.5px solid var(--bad); color:var(--bad)}
.dl{margin:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:2px 14px}
.drow{display:flex; gap:12px; justify-content:space-between; align-items:baseline; padding:10px 0; border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow dt{color:var(--muted); font-size:14px; flex-shrink:0}
.drow dd{margin:0; text-align:right; font-weight:500; overflow-wrap:anywhere; min-width:0}
.sv.late{color:var(--bad); font-weight:700}
.sv.warn{color:var(--warn); font-weight:700}
.pbar{position:fixed; left:0; right:0; bottom:0; z-index:26; padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background:var(--bg); border-top:1px solid var(--line)}
.pbar > *{max-width:640px; margin-left:auto; margin-right:auto}
.pbar.two{display:flex; gap:10px}
.pbar.two button{flex:1; min-height:56px; border-radius:12px; font-weight:700; font-size:17px; border:0}
.pbar.two .no{flex:0 0 30%; background:none; border:1.5px solid var(--accent); color:var(--accent)}
.pbar.two .yes{background:var(--accent); color:var(--accent-ink)}
.pbar.two .yes[disabled]{background:var(--line); color:var(--muted)}
.pbtn{width:100%; min-height:58px; border-radius:12px; border:0; background:var(--accent); color:var(--accent-ink); font-size:19px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:10px}
.pbar.pbar3{display:flex; gap:8px}
.pbar.pbar3 .pbtn{width:auto; flex:1; min-height:56px; font-size:14px; gap:4px; padding:0 2px}
.pbtn.ret{background:var(--ok); color:#fff}
.pdis{display:block; text-align:center; padding:16px; border-radius:12px; border:1.5px solid var(--line); color:var(--muted); font-weight:600}
.wrap:has(.pbar){padding-bottom:calc(110px + env(safe-area-inset-bottom, 0px))}

/* penyimpanan */
.stat3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stat3 > div{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center}
.stat3 b{display:block; font-family:var(--f-display); font-size:34px; line-height:1}
.stat3 small{color:var(--muted); font-size:13px}
.stat3 .lowc b{color:var(--warn)}
.tbox{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:6px}
.tbox.scroll{max-height:30vh; overflow:auto}
.trow{width:100%; display:flex; align-items:center; gap:10px; padding:8px 12px; border:0; border-top:1px solid var(--line); background:none; text-align:left; min-height:56px}
.trow:first-child{border-top:0}
.trow .nm{min-width:0; flex-grow:1; display:flex; flex-direction:column; overflow-wrap:anywhere}
.trow .nm b{font-weight:600; font-size:16px}
.rnd{width:44px; height:44px; border-radius:22px; border:1.5px solid var(--accent); background:none; color:var(--accent); font-size:24px; font-weight:700; line-height:1; flex-shrink:0; display:flex; align-items:center; justify-content:center}
.rnd.big{width:56px; height:56px; border-radius:28px; font-size:30px}
.qty{min-width:64px; text-align:center; line-height:1.1}
.qty b{display:block; font-size:20px}
.qty small{font-size:12px; color:var(--muted)}
.qty.low b{color:var(--warn)}
.selrow{width:100%; display:flex; align-items:center; gap:10px; padding:8px 12px; border:0; border-top:1px solid var(--line); background:none; text-align:left; min-height:60px}
.selrow:first-child{border-top:0}
.selrow.on{background:var(--accent-soft)}
.selrow .nm{min-width:0; flex-grow:1; display:flex; flex-direction:column}
.selrow .nm b{font-weight:600}
.selrow .nm small{font-size:13px; color:var(--muted)}
.selrow .cb{width:26px; height:26px; border-radius:7px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--accent-ink)}
.selrow.on .cb{background:var(--accent); border-color:var(--accent)}

/* material */
.mlistw{display:flex; flex-direction:column; gap:8px}
.mrow2{width:100%; display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--line); text-align:left}
.mrow2:hover{border-color:var(--accent)}
.mrow2 .nm{min-width:0; flex-grow:1}
.mrow2 .nm b{display:block; font-size:17px; font-weight:600; overflow-wrap:anywhere}
.mrow2 .nm small{display:block; font-size:13px; color:var(--muted)}
.mrow2 .pills{margin-top:4px}
.matbig{text-align:center; padding:14px 8px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
.matbig .qn{display:block; font-family:var(--f-display); font-weight:700; font-size:64px; line-height:1}
.matbig .qn.low{color:var(--warn)}
.matbig .qs{display:block; color:var(--muted); margin-bottom:8px}
.slog{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.slog li{display:flex; gap:12px; align-items:center; padding:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.slog .sg{min-width:56px; font-family:var(--f-mono); font-weight:500; font-size:17px}
.slog .sg.Keluar{color:var(--bad)}
.slog .sg.Masuk{color:var(--ok)}
.slog .tx{min-width:0; overflow-wrap:anywhere}

/* lembar bawah: foto dan stok */
.ovsheet{position:fixed; inset:0; z-index:65}
.ovsheet .dbg{position:absolute; inset:0; width:100%; border:0; background:rgba(27,34,38,.6)}
.fsheet{position:absolute; left:0; right:0; bottom:0; max-width:640px; margin:0 auto; max-height:92vh; overflow:auto; background:var(--surface); color:var(--ink); border-radius:22px 22px 0 0; padding:10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:12px}
.fsheet .grab{width:44px; height:4px; border-radius:2px; background:var(--line); margin:0 auto; flex-shrink:0}
.fsheet .sh-t{font-family:var(--f-display); font-weight:700; font-size:22px; letter-spacing:.03em; text-transform:uppercase}
.fsheet .yn{margin-top:2px}
.frow{display:flex; gap:12px; align-items:center}
.bigbtn{min-height:92px; border-radius:14px; border:2px solid var(--line); background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-weight:700; font-size:16px}
.bigbtn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.cropwrap{display:flex; justify-content:center}
.cropwrap canvas{border-radius:12px; background:#222; touch-action:none; cursor:grab; max-width:100%}
.crctl{display:flex; align-items:center; gap:10px}
.crctl input[type=range]{flex:1; min-height:44px}
.x2{width:48px; height:48px; border-radius:24px; border:1.5px solid var(--line); background:none; color:var(--ink); display:flex; align-items:center; justify-content:center}
.stepper{display:flex; align-items:center; gap:10px}
.stepper .field{text-align:center; font-size:26px; font-weight:700; min-height:56px}
.qchips{margin:0}
.after{margin:0; padding:10px 12px; border-radius:10px; background:var(--accent-soft); font-size:16px}
.after small{font-weight:400}

/* panduan */
.pdhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
.pdhead b{display:block; font-family:var(--f-display); font-size:24px; text-transform:uppercase; letter-spacing:.03em}
.pdwarn{display:flex; gap:10px; align-items:flex-start; margin-bottom:10px}
.pdsec{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px}
.pdsec h3{margin:0 0 6px; font-family:var(--f-display); font-size:19px; text-transform:uppercase; letter-spacing:.04em}
.pdl{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:6px}
.vlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.vlist button{width:100%; text-align:left; padding:10px 12px; border-radius:10px; background:var(--surface); border:1px solid var(--line)}
.vlist button[aria-current="true"]{border-color:var(--accent); background:var(--accent-soft)}

/* tabel (layar lebar dan impor) */
.tblwrap{overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
.tbl{width:100%; border-collapse:collapse; font-size:15px}
.tbl th{position:sticky; top:0; text-align:left; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:10px 12px; background:var(--surface); border-bottom:2px solid var(--line)}
.tbl td{padding:8px 12px; border-top:1px solid var(--line); vertical-align:middle}
.tbl tbody tr[data-action]{cursor:pointer}
.tbl tbody tr[data-action]:hover{background:var(--accent-soft)}
.tbl.small{font-size:13px}
.tbl tr.badrow td{background:var(--bad-bg); color:var(--bad)}
.impl{margin:8px 0 0; padding-left:18px; font-size:14px; color:var(--muted)}
.impl.bad{color:var(--bad)}

/* layar lebar: menu tetap di kiri */
body.pinned{padding-left:264px}
body.pinned #drawer{position:fixed; top:0; left:0; bottom:0; right:auto; width:264px; z-index:40}
body.pinned #drawer .dbg{display:none}
body.pinned #drawer aside{width:264px; box-shadow:none; border-right:1px solid var(--line)}
body.pinned .hbtn[data-action="menu"]{display:none}
body.pinned .top .in{max-width:1180px; padding-left:16px}
body.pinned .wrap{max-width:1180px}
body.pinned .bnav{display:none}
body.pinned .fab{right:24px; bottom:24px}
body.pinned .pbar{left:264px}
body.pinned #toast{bottom:32px}
.wrap.wide .jlist,.wrap.wide .tblwrap{max-width:none}
.wrap.wide #jlist{display:block}

.muted a,.note a{color:var(--accent)}
.sh-row{display:flex; align-items:center; justify-content:space-between; gap:8px}
.sh-row .sh-t{min-width:0; overflow-wrap:anywhere}

/* ---- loading ---- */
.prog{height:3px; background:rgba(255,255,255,.18); overflow:hidden; position:relative}
.prog i{position:absolute; top:0; bottom:0; width:40%; background:#7FB9E4; animation:progmove 1.1s ease-in-out infinite}
@keyframes progmove{0%{left:-40%}100%{left:100%}}
.savebar{position:sticky; top:calc(67px + env(safe-area-inset-top, 0px)); z-index:29; background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600; text-align:center; padding:5px 12px}
.savebar.ok{background:var(--ok-bg); color:var(--ok)}
.spin{display:inline-block; width:18px; height:18px; border:3px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spinr .7s linear infinite; flex-shrink:0}
@keyframes spinr{to{transform:rotate(360deg)}}
button.loading{opacity:.75; cursor:progress}
@media (prefers-reduced-motion:reduce){.prog i{animation-duration:3s}.spin{animation-duration:1.6s}}

/* ---- header: tombol + Mesin baru ---- */
.hbtn.txt{width:auto; padding:0 12px; gap:6px; font-weight:700; font-size:15px; border:1.5px solid rgba(255,255,255,.45)}
.hbtn.txt span{white-space:nowrap}
.top .in .hbtn.txt{margin-right:4px}

/* ---- kartu unit (tiga tingkat) ---- */
.ucard .l1 .unum{font-size:17px; color:var(--ink); margin:0}
.ucard .l1 .dot{margin:0 6px; color:var(--muted)}
.ucard .l2{display:flex; flex-direction:column; gap:3px}
.kv{display:flex; justify-content:space-between; gap:10px; font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-weight:600; color:var(--ink); text-align:right; overflow-wrap:anywhere}
.ucard .ex{font-size:13px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere}
.jcard.sel{border-color:var(--accent); background:var(--accent-soft)}
.cnt.soft{background:var(--warn)!important}

/* ---- pilihan tampilan di menu ---- */
.themeseg,.langseg{padding:6px 14px 10px}
.themeseg .tl,.langseg .tl{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--muted); font-weight:600; margin-bottom:6px}
.seg{display:grid; grid-template-columns:repeat(3,1fr); border:1.5px solid var(--line); border-radius:10px; overflow:hidden}
.seg.seg2{grid-template-columns:repeat(2,1fr)}
.seg button{min-height:42px; border:0; background:var(--surface); font-size:14px; font-weight:600; color:var(--ink)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

/* ---- layar lebar: daftar nama + panel detail ---- */
.lhead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
.lhead b{font-family:var(--f-display); font-size:24px; text-transform:uppercase; letter-spacing:.03em}
.lhead .btn{padding:0 14px}
.split{display:grid; grid-template-columns:370px minmax(0,1fr); gap:18px; align-items:start}
.lcol{position:sticky; top:84px; max-height:calc(100vh - 100px); overflow:auto; padding-right:4px}
.dpane{min-width:0}
.dhead{display:flex; gap:14px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
.dhead .dt{flex:1; min-width:200px}
.dhead h1{margin:0; font-family:var(--f-display); font-weight:700; font-size:34px; text-transform:uppercase; letter-spacing:.02em; line-height:1.05}
.hero.small{height:96px; width:140px; margin:0; flex-shrink:0}
.hero.small .herobtn{min-height:30px; padding:0 8px; font-size:12px; right:6px; bottom:6px}
.mcards{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}

<script>
'use strict';
const CFG = window.CONFIG || {};
const API_URL = CFG.API_URL || '';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = s => String(s ?? '').replace(/\s+/g, ' ').trim();
const norm = s => clean(s).toLowerCase();
const p2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const today = () => ymd(new Date());
const nowIso = () => { const d = new Date(); return ymd(d) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); };
const nowHM = () => { const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const parseYmd = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => parseYmd(s).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtShort = s => parseYmd(s).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtHM = t => t ? String(t).slice(11, 16) : '';
const fmtDT = t => t ? parseYmd(t).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) + ' ' + fmtHM(t) : '';
const daysFromToday = s => Math.round((parseYmd(s) - parseYmd(today())) / 86400000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const byName = (a, b) => String(a).localeCompare(String(b), 'id');

/* ---------- ikon ---------- */
const IC = {
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  tool: '<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 005.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 010 6.4M18 14.4c2.2.7 3.5 2.6 3.5 5.6"/>',
  doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  qr: '<rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>',
  refresh: '<path d="M20 11a8 8 0 00-14-4M4 5v4h4M4 13a8 8 0 0014 4M20 19v-4h-4"/>',
  logout: '<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  box: '<path d="M4 8l8-4 8 4v9l-8 4-8-4zM4 8l8 4 8-4M12 12v9"/>',
  cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  img: '<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  rotl: '<path d="M4 9a8 8 0 1114 6M4 4v5h5"/>',
  rotr: '<path d="M20 9a8 8 0 10-14 6M20 4v5h-5"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',
  print: '<path d="M7 9V4h10v5M7 17H5a1 1 0 01-1-1v-5a2 2 0 012-2h12a2 2 0 012 2v5a1 1 0 01-1 1h-2"/><rect x="7" y="14" width="10" height="6"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/>',
  book: '<path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h10"/>',
  minus: '<path d="M5 12h14"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
  alert: '<path d="M12 4l9 16H3zM12 10v4M12 17h.01"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'
};
const ic = (n, s = 24) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>';

/* ---------- tampilan: Otomatis (ikut perangkat), Terang, Gelap ---------- */
const THEMES = ['auto', 'light', 'dark'], THEME_L = { auto: 'Otomatis', light: 'Terang', dark: 'Gelap' };
const getTheme = () => { const t = lsGet('qrg.theme', 'auto'); return THEMES.includes(t) ? t : 'auto'; };
function setTheme(t) {
  lsSet('qrg.theme', t);
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
}

/* ---------- state ---------- */
const KONDISI = ['Normal', 'Servis', 'Rusak', 'Rusak total', 'Belum dicek'];
const MJENIS = ['Servis rutin', 'Ganti sparepart', 'Perbaikan', 'Kalibrasi', 'Pengecekan', 'Lainnya'];
const S = {
  view: 'mesin', nm: null, wj: null, jid: null, kode: null, tid: null, mid: null, tab: 'unit', filter: '', q: '',
  jenis: [], units: [], kategori: [], tempat: [], material: [], pekerja: [], maintServer: [], pengServer: [], pengDate: null, belumServer: [], skema: {}, cfg: { jamPulang: '17:00', pengedit: ['Abidin', 'Vikar', 'La Ode Riyan Syaputra'] },
  loaded: false, loadError: null, tok: lsGet('qrg.tok', ''), me: lsGet('qrg.me', ''),
  ov: [], pending: null, form: null, confirmDel: null, skForm: null,
  rwDate: null, rw: { list: null, error: false }, riw: { key: null, list: null, error: false }, logs: { list: null, error: false },
  scan: null, picker: null, justAdded: null, focus: null
};
let J = {}, U = {}, JU = {}, T = {}, M = {};

function statusOf(label) {
  const l = norm(label);
  if (l === 'normal') return 'ok';
  if (l === 'rusak' || l === 'rusak total') return 'bad';
  if (!l || l === 'belum dicek') return 'unk';
  return 'warn';
}
function buildMaps() {
  J = {}; U = {}; JU = {}; T = {}; M = {};
  S.tempat.forEach(t => { T[t.id] = t; });
  S.material.forEach(m => { M[m.id] = m; });
  S.jenis.forEach(j => { J[j.id] = j; JU[j.id] = []; });
  S.units.forEach(u => { U[u.k] = u; if (JU[u.j]) JU[u.j].push(u); });
  Object.values(JU).forEach(l => l.sort((a, b) => (Number(a.u) || 0) - (Number(b.u) || 0) || a.k.localeCompare(b.k)));
}
function setUnits(list) {
  S.units = list.map(u => ({ ...u, off: !!u.off, cond: clean(u.sl) || 'Belum dicek', s: u.off ? 'unk' : statusOf(u.sl), sl: u.off ? 'Nonaktif' : (clean(u.sl) || 'Belum dicek') }));
}
function applyData(d) {
  S.jenis = d.jenis || []; S.kategori = d.kategori || []; S.tempat = d.tempat || []; S.material = d.material || [];
  setUnits(d.unit || []);
  buildMaps();
  S.pekerja = d.pekerja || []; S.maintServer = d.maintenance || d.maint || []; S.belumServer = d.belum || []; S.skema = d.skema || {}; S.cfg = { ...S.cfg, ...(d.cfg || {}) };
  if (!S.cfg.pengedit || !S.cfg.pengedit.length) S.cfg.pengedit = ['Abidin', 'Vikar', 'La Ode Riyan Syaputra'];
  S.loaded = true;
  if (typeof syncFoto === 'function') syncFoto();
}
/* ---------- mesin dikelompokkan per nama: nama > merek/model > unit ---------- */
const nameKey = j => norm(j.n);
function nameGroups() {
  const m = new Map();
  S.jenis.forEach(j => {
    const k = nameKey(j);
    if (!m.has(k)) m.set(k, { key: k, name: j.n, cat: j.c, jenis: [] });
    m.get(k).jenis.push(j);
  });
  m.forEach(g => g.jenis.sort((a, b) => byName(a.b, b.b) || byName(a.m, b.m)));
  return m;
}
const nameGroup = k => nameGroups().get(k) || null;
const nameUnits = g => g.jenis.reduce((a, j) => a.concat(JU[j.id] || []), []);
const editors = () => S.cfg.pengedit;
const isEditor = n => editors().some(e => norm(e) === norm(n));
const deptList = () => [...new Set(S.pekerja.map(p => p.d).filter(Boolean))].sort(byName);
const deptOf = nama => { const p = S.pekerja.find(p => norm(p.n) === norm(nama)); return p ? p.d : ''; };
const jenisOf = u => J[u.j] || { id: u.j, n: u.k, b: '', m: '', c: '' };
const mesinText = u => { const j = jenisOf(u); return j.n + ' (unit ' + u.u + ')'; };
const modelText = j => [j.b, j.m].filter(Boolean).join(' ');
const subText = j => [j.b, j.m].filter(Boolean).join(' · ');
const unitTitle = u => jenisOf(u).n + ' · Unit ' + u.u;
function patchUnit(kode, kondisi) {
  const u = U[kode]; if (!u) return;
  u.cond = kondisi; u.sl = u.off ? 'Nonaktif' : kondisi; u.s = u.off ? 'unk' : statusOf(kondisi);
}

/* ---------- tempat penyimpanan ---------- */
const isLok = v => /^LOK-\d{3}$/.test(String(v || ''));
const placeOf = u => (u && isLok(u.loc) ? T[u.loc] : null);
const hasPlace = u => !!placeOf(u);
const placeName = u => { const t = placeOf(u); return t ? t.n : ''; };
const placeText = u => { const t = placeOf(u); return t ? t.n + (t.l ? ' · ' + t.l : '') : 'Belum punya tempat'; };
const activePlaces = () => S.tempat.filter(t => !t.off).sort((a, b) => byName(a.n, b.n));
const topPlaces = () => activePlaces().filter(t => !t.ind);
const childRaks = tid => activePlaces().filter(t => t.ind === tid);
function placeSummary(tid) {
  const held = heldMap();
  const us = S.units.filter(u => !u.off && u.loc === tid);
  const mats = allMaterial().filter(m => !m.off && m.loc === tid);
  return { units: us, out: us.filter(u => held.has(u.k)).length, mats, low: mats.filter(isLow).length };
}

/* ---------- material dan stok (dengan catatan stok yang menunggu terkirim) ---------- */
function stokApply(q, p) {
  const j = Number(String(p.jumlah).replace(',', '.')) || 0;
  if (p.tipe === 'Keluar' || p.tipe === 'Pinjam') return Math.round((q - j) * 1000) / 1000;
  if (p.tipe === 'Masuk' || p.tipe === 'Kembali') return Math.round((q + j) * 1000) / 1000;
  return j;
}
function allMaterial() {
  const pend = Q.items.filter(i => i.action === 'stok');
  return S.material.map(m => {
    let q = m.q; pend.forEach(i => { if (i.payload.mat === m.id) q = stokApply(q, i.payload); });
    return pend.length && q !== m.q ? { ...m, q, pending: true } : m;
  });
}
const isLow = m => m.lo > 0 && m.q <= m.lo;
const fmtQty = n => { const r = Math.round(n * 1000) / 1000; return r.toLocaleString('id-ID', { maximumFractionDigits: 3 }); };

/* ---------- servis berikutnya: dari catatan maintenance, atau interval panduan ---------- */
function addMonths(ymdStr, n) { const d = parseYmd(ymdStr); const day = d.getDate(); d.setMonth(d.getMonth() + n); if (d.getDate() < day) d.setDate(0); return ymd(d); }
function nextService(k) {
  const u = U[k]; if (!u) return '';
  const l = maintFor(k); if (!l.length) return '';
  if (l[0].next) return l[0].next;
  const j = J[u.j]; return j && j.pi > 0 ? addMonths(l[0].tgl, j.pi) : '';
}
function serviceText(k) {
  const n = nextService(k); if (!n) return { t: 'Belum ada jadwal', c: '' };
  const d = daysFromToday(n);
  return d < 0 ? { t: 'Terlewat ' + (-d) + ' hari', c: 'late' } : d === 0 ? { t: 'Hari ini', c: 'warn' } : { t: d + ' hari lagi', c: d <= 7 ? 'warn' : '' };
}

/* ---------- indikator loading: tombol berputar, garis proses di bawah header, tulisan status ---------- */
const Busy = { n: 0, btn: null, orig: '', msg: '', ok: false, edit: false };
function busyRender() {
  const pr = $('#prog'), sb = $('#savebar'); if (!pr || !sb) return;
  pr.hidden = Busy.n === 0;
  if (Busy.n > 0) { sb.hidden = false; sb.className = 'savebar'; sb.textContent = Busy.msg; }
  else if (Busy.ok) { sb.hidden = false; sb.className = 'savebar ok'; sb.textContent = 'Tersimpan'; }
  else sb.hidden = true;
}
function busyBegin(msg, withBtn) {
  Busy.n++; Busy.ok = false; clearTimeout(Busy.t);
  Busy.msg = msg || 'Menyimpan ke Sheet. Mohon tunggu, jangan tutup halaman.';
  if (withBtn && !Busy.btn) {
    const b = window.__btn;
    if (b && b.isConnected && b.tagName === 'BUTTON') { Busy.btn = b; Busy.orig = b.innerHTML; b.disabled = true; b.classList.add('loading'); b.innerHTML = '<span class="spin"></span>Menyimpan…'; }
  }
  busyRender();
}
function busyEnd(ok) {
  Busy.n = Math.max(0, Busy.n - 1);
  if (Busy.n === 0) {
    if (Busy.btn) { if (Busy.btn.isConnected) { Busy.btn.innerHTML = Busy.orig; Busy.btn.disabled = false; Busy.btn.classList.remove('loading'); } Busy.btn = null; }
    if (ok) { Busy.ok = true; Busy.t = setTimeout(() => { Busy.ok = false; busyRender(); }, 2200); }
  }
  busyRender();
}
/* aksi yang menulis ke Sheet */
const WRITE_ACTIONS = new Set(['addUnit', 'editUnit', 'editJenis', 'nonaktifUnit', 'aktifkanUnit', 'renameMerek', 'gabungJenis', 'addTempat', 'editTempat', 'nonaktifTempat', 'aktifTempat', 'setTempat',
  'fotoSet', 'fotoHapus', 'panduanSimpan', 'addMaterial', 'editMaterial', 'statusMaterial', 'stok', 'imporUnit', 'savePekerja', 'arsipkan', 'addPengambilan', 'returnPengambilan', 'batalKembali',
  'cancelPengambilan', 'addMaintenance', 'deleteMaintenance', 'buatRak', 'saranTolak', 'pulihKondisi', 'imporRak']);

/* ---------- API dan login ---------- */
async function raw(action, payload = {}) {
  if (!API_URL || API_URL.includes('PASTE')) throw { code: 'config' };
  let res;
  try { res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }) }); }
  catch (e) { throw { code: 'network' }; }
  try { return await res.json(); } catch (e) { throw { code: 'server' }; }
}
async function api(action, payload = {}) {
  const w = WRITE_ACTIONS.has(action);
  if (w) busyBegin(null, !Q.busy);
  let ok = false;
  try { return await api_(action, payload, () => { ok = true; }); }
  finally { if (w) busyEnd(ok); }
}
async function api_(action, payload, done) {
  const j = await raw(action, { token: S.tok, ...payload });
  if (!j.ok) {

const Q = { items: lsGet('qrg.queue', []), busy: false };

function groupMatch(g, held, q, f) {

  if (f === 'telat') return us.some(u => !u.off && nextService(u.k) && daysFromToday(nextService(u.k)) < 0);

}

function parseImport(text) {

    const parts = l.includes('\t') ? l.split('\t') : l.includes(';') ? l.split(';') : l.split(',');

}
async function saveWorkers(list) {
  const seen = new Set(), out = [];
  list.forEach(p => { const n = clean(p.n); if (n && !seen.has(norm(n))) { seen.add(norm(n)); out.push({ n, d: clean(p.d) }); } });
  out.sort((a, b) => (a.d + '|' + a.n).localeCompare(b.d + '|' + b.n, 'id'));
  const before = S.pekerja; S.pekerja = out; renderLive();
  try { await api('savePekerja', { pekerja: out }); lsSet('qrg.c3', { ...lsGet('qrg.c3', {}), pekerja: out }); }
  catch (e) { S.pekerja = before; renderLive(); toast(e.code === 'network' ? 'Tidak ada sinyal. Daftar belum tersimpan.' : 'Daftar tidak bisa disimpan.'); return false; }
  return true;
}

/* ---------- Dasbor: baca saja, dari data yang sudah dimuat (bootstrap). Tidak ada tombol ubah data. ---------- */
function dasborStats() {
  const open = openEntries(), late = open.filter(isLate);
  const act = S.units.filter(u => !u.off);
  const broken = act.filter(u => u.s === 'bad' || u.cond === 'Servis').filter(u => !heldMap().has(u.k));
  const due = [];
  act.forEach(u => { const n = nextService(u.k); if (n) { const d = daysFromToday(n); if (d <= 7) due.push({ u, d }); } });
  due.sort((a, b) => a.d - b.d);
  const places = activePlaces();
  const empty = places.filter(p => { const sm = placeSummary(p.id); return !sm.units.length && !sm.mats.length; });
  const noPlace = act.filter(u => !hasPlace(u));
  const low = allMaterial().filter(m => !m.off && isLow(m));
  return { open, late, broken, due, places, empty, noPlace, low };
}

/* ---------- foto per jenis: disimpan kecil (sekitar 360 px) di sheet Foto, disalin ke HP ---------- */
const FOTO = { cache: lsGet('qrg.foto', {}), busy: false };
const FOTO_PX = 360;
const fotoSrc = jid => { const c = FOTO.cache[jid]; return c && c.d ? c.d : ''; };
function thumbHtml(jid, size, cls) {
  const src = jid ? fotoSrc(jid) : '';
  return '<span class="thumb' + (cls ? ' ' + cls : '') + '"' + (jid ? ' data-foto="' + esc(jid) + '"' : '') + '>' + (src ? '<img src="' + src + '" alt="">' : ic('tool', size || 30)) + '</span>';
}
function refreshThumbs() {
  document.querySelectorAll('[data-foto]').forEach(el => {
    const src = fotoSrc(el.dataset.foto), has = !!el.querySelector('img');
    if (src && (!has || el.querySelector('img').getAttribute('src') !== src)) el.innerHTML = '<img src="' + src + '" alt="">';
    else if (!src && has) el.innerHTML = ic('tool', el.classList.contains('hero') ? 56 : 30);
  });
}
function saveFotoCache() { lsSet('qrg.foto', FOTO.cache); }
/* ambil foto yang belum ada di HP atau sudah berganti */
async function syncFoto() {
  const ids = new Set(S.jenis.filter(j => j.f).map(j => j.id));
  let dirty = false;
  Object.keys(FOTO.cache).forEach(id => { if (!ids.has(id)) { delete FOTO.cache[id]; dirty = true; } });
  if (dirty) { saveFotoCache(); refreshThumbs(); }
  const need = S.jenis.filter(j => j.f && (!FOTO.cache[j.id] || FOTO.cache[j.id].t !== j.f)).map(j => j.id);
  if (!need.length || FOTO.busy) return;
  FOTO.busy = true;
  try {
    for (let i = 0; i < need.length; i += 8) {
      const r = await api('fotoGet', { ids: need.slice(i, i + 8) });
      Object.entries(r.foto || {}).forEach(([id, f]) => { if (J[id] && f.d && String(f.d).startsWith('data:image/jpeg;base64,')) FOTO.cache[id] = { t: f.t, d: f.d }; });
      saveFotoCache(); refreshThumbs();
    }
  } catch (e) { /* tanpa sinyal: foto yang sudah ada tetap tampil */ }
  FOTO.busy = false;
}

/* ---------- pemotong foto ---------- */
const FV = 300; /* sisi kotak pemotong (px layar) */
async function loadBitmap(file) {
  try { if (window.createImageBitmap) return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {}
  return await new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('gambar')); };
    im.src = url;
  });
}

      '<div class="yn"><button class="no" data-action="fotoback">Ganti foto</button><button class="yes" data-action="fotosave"' + (f.busy ? ' disabled' : '') + '>' + (f.busy ? 'Menyimpan…' : 'Simpan foto') + '</button></div>';
  }
  $('#fotoSheet').innerHTML = h + '</section>';
  if (f.step === 'crop') drawCrop();

async function fotoPicked(file) {
  const f = S.fotoEd; if (!f || !file) return;
  try {
    const bmp = await loadBitmap(file);
    f.src = bmp; f.rot = 0; f.zoom = 1; f.ox = 0; f.oy = 0; f.step = 'crop';
    makeWork(); renderFoto();
  } catch (e) { toast('Foto ini tidak bisa dibaca. Coba foto lain.'); }
}
/* gambar kerja: sudah diputar dan dikecilkan (maks 1000 px) */
function makeWork() {
  const f = S.fotoEd, b = f.src, w0 = b.width || b.naturalWidth, h0 = b.height || b.naturalHeight;
  const sc = Math.min(1, 1000 / Math.max(w0, h0)), odd = f.rot % 2 !== 0;
  const w = Math.round(w0 * sc), h = Math.round(h0 * sc);
  const c = document.createElement('canvas'); c.width = odd ? h : w; c.height = odd ? w : h;
  const x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(f.rot * Math.PI / 2); x.drawImage(b, -w / 2, -h / 2, w, h);
  f.work = c;
}
function cropGeom(f, V) {
  const c = f.work, s = (V / Math.min(c.width, c.height)) * f.zoom, dw = c.width * s, dh = c.height * s;
  const mx = Math.max(0, (dw - V) / 2) / V, my = Math.max(0, (dh - V) / 2) / V;
  f.ox = Math.max(-mx, Math.min(mx, f.ox)); f.oy = Math.max(-my, Math.min(my, f.oy));
  return { x: V / 2 - dw / 2 + f.ox * V, y: V / 2 - dh / 2 + f.oy * V, w: dw, h: dh };
}
function drawCrop() {
  const f = S.fotoEd, cv = $('#cropCv'); if (!f || !cv || !f.work) return;
  const V = cv.width, g = cropGeom(f, V), x = cv.getContext('2d');
  x.fillStyle = '#222'; x.fillRect(0, 0, V, V); x.drawImage(f.work, g.x, g.y, g.w, g.h);
}
function exportFoto() {
  const f = S.fotoEd, g0 = cropGeom(f, 1000);
  let px = FOTO_PX;
  for (let round = 0; round < 6; round++) {
    const out = document.createElement('canvas'); out.width = out.height = px;
    const x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, px, px);
    const k = px / 1000; x.imageSmoothingQuality = 'high'; x.drawImage(f.work, g0.x * k, g0.y * k, g0.w * k, g0.h * k);
    for (const q of [0.78, 0.68, 0.58, 0.48, 0.4]) {
      const d = out.toDataURL('image/jpeg', q);
      if (d.length <= 44000) return d;
    }
    px = Math.round(px * 0.85);
  }
  return '';
}
async function fotoSave() {
  const f = S.fotoEd; if (!f || f.busy) return;
  const d = exportFoto();
  if (!d) { toast('Foto terlalu besar. Pilih foto lain.'); return; }
  ensureMe(async () => {
    const fe = S.fotoEd; if (!fe) return;
    fe.busy = true; renderFoto();
    try {
      const r = await api('fotoSet', { jid: fe.jid, foto: d, oleh: S.me });
      FOTO.cache[fe.jid] = { t: r.t, d }; saveFotoCache();
      if (J[fe.jid]) J[fe.jid].f = r.t;
      fe.busy = false; closeTop(); refreshThumbs(); toast('Foto disimpan.'); loadAll(true);
    } catch (e) { if (S.fotoEd) { S.fotoEd.busy = false; renderFoto(); } failed(e); }

    case 'stokopen': openStok(t.dataset.id, t.dataset.t); break;
    case 'stokclose': closeTop(); break;
    case 'stoktipe': if (S.stokEd) { const m = stokMat(); S.stokEd.tipe = t.dataset.t; S.stokEd.jumlah = t.dataset.t === 'Koreksi' && m ? String(m.q) : '1'; renderStok(); } break;
    case 'stokstep': if (S.stokEd) { const j = Math.max(0, Math.round(((stokNum() || 0) + Number(t.dataset.d)) * 1000) / 1000); S.stokEd.jumlah = String(j); $('#stokJ').value = S.stokEd.jumlah; stokPreview(); } break;
    case 'stokq': if (S.stokEd) { S.stokEd.jumlah = t.dataset.n; $('#stokJ').value = t.dataset.n; stokPreview(); } break;
    case 'stoknama': openPicker({ title: 'Siapa?', sub: 'Nama pekerja yang mengambil atau menerima.', onPick: n => { if (S.stokEd) { S.stokEd.nama = n; renderStok(); } } }); break;
    case 'stokgo': stokSubmit(); break;
    /* panduan */
    case 'pdedit': go('panduan', { jid: curJid() }); break;
    case 'pdsave': savePanduan(); break;
    case 'pdver': if (S.pd) { S.pd.vi = Number(t.dataset.i); const el = $('#live-pd'); if (el) el.innerHTML = livePanduan(); } break;
    case 'pdmaint': pdMaint(); break;
    /* impor excel */
    case 'impcontoh': impContoh(); break;
    case 'impreset': S.imp = null; impRender(); break;
    case 'impgo': impGo(); break;
    /* impor isi rak */
    case 'ircontoh': irContoh(); break;
    case 'irreset': S.imr = null; irRender(); break;
    case 'irgo': irGo(); break;
    /* impor foto massal */
    case 'fipick': fiPick(Number(t.dataset.i)); break;
    case 'firemove': fiRemove(Number(t.dataset.i)); break;
    case 'fireset': fiReset(); break;
    case 'figo': fiGo(); break;
    /* dasbor */
    case 'dasborprint': window.print(); break;
    /* menu */
    case 'dscan': afterOv(() => openScan({ mode: 'ambil' })); break;
    case 'srterima': saranTerima(t.dataset.id); break;
    case 'srtolak': saranTolakSet(t.dataset.id); break;
    case 'srbatal': saranTolakSet(t.dataset.id, true); break;
    case 'srtoggle': S.showRj = !S.showRj; renderLive(); break;
    case 'rakbuat': callEdit('buatRak', { dari: 1, sampai: 50 }, r => r.dibuat + ' rak dibuat, ' + r.dilewati + ' sudah ada.', () => renderLive()); break;
    /* maintenance */
    case 'maintopen': $('#maintForm').hidden = false; t.hidden = true; $('#mCat').focus(); break;
    case 'maintcancel': $('#maintForm').hidden = true; $('#maintOpenBtn').hidden = false; break;
    case 'delmaint': if (S.confirmDel === t.dataset.id) { S.confirmDel = null; enqueue('deleteMaintenance', { id: t.dataset.id }); renderLive(); } else armConfirm(t.dataset.id); break;
    /* kolom maintenance custom per jenis */
    case 'skemaopen': go('skema', { jid: t.dataset.id }); break;
    case 'skadd': S.skForm = { label: '', tipe: 'teks' }; render(); break;
    case 'skedit': { const f = skemaFor(curJid()).find(x => x.id === t.dataset.id); if (f) { S.skForm = { ...f }; render(); } break; }
    case 'skcancel': S.skForm = null; render(); break;
    case 'sksave': saveSkema(); break;
    case 'skdel': {
      const key = 'sk:' + t.dataset.id;
      if (S.confirmDel === key) { S.confirmDel = null; callEdit('skemaHapusKolom', { jenisId: curJid(), kolomId: t.dataset.id }, 'Kolom dihapus.', () => render()); }
      else { S.confirmDel = key; render(); setTimeout(() => { if (S.confirmDel === key) { S.confirmDel = null; render(); } }, 4000); }
      break;
    }
    /* pengambilan */
    case 'uambil': openScanPreset('ambil', t.dataset.k); break;
    case 'uret': openScanPreset('kembali', t.dataset.k); break;
    case 'ret': returnIds([t.dataset.id], 'Baik'); toast('Dikembalikan.'); refresh(); break;
    case 'retrusak': returnIds([t.dataset.id], 'Rusak'); patchUnit(t.dataset.k, 'Rusak'); toast('Dikembalikan dan ditandai rusak.'); refresh(); break;
    /* scan */
    case 'scan': openScan({ mode: 'ambil' }); break;
    case 'scanclose': closeTop(); break;
    case 'scanmode': scanSetMode(t.dataset.mode); break;
    case 'scanmore': if (S.scan) { S.scan.paused = false; S.scan.fb = null; lastCode = ''; renderScan(); if (!stream) startCamera(); } break;
    case 'bremove': if (S.scan) { S.scan.basket = S.scan.basket.filter(b => b.kode !== t.dataset.k); if (!S.scan.basket.length) S.scan.paused = false; renderScan(); } break;
    case 'bkond': { const b = S.scan && S.scan.basket.find(x => x.kode === t.dataset.k); if (b) { b.kondisi = t.dataset.v; renderScan(); } break; }
    case 'bname': {
      const sc = S.scan, i = sc.basket.findIndex(x => x.kode === t.dataset.k), item = sc.basket[i];
      let same = ''; for (let k = i - 1; k >= 0; k--) if (sc.basket[k].name) { same = sc.basket[k].name; break; }
      openPicker({ title: 'Siapa yang mengambil?', sub: item.kode + ' · ' + unitTitle(U[item.kode]), same, onPick: n => { item.name = n; renderScan(); } });
      break;
    }
    case 'scanyes': scanYes(); break;
    case 'scanclear': if (S.scan) { S.scan.basket = []; S.scan.paused = false; S.scan.fb = null; renderScan(); } break;
    case 'scanundo': scanUndo(); break;
    case 'scanagain': if (S.scan) { S.scan.done = null; S.scan.paused = false; S.scan.fb = null; lastCode = ''; renderScan(); } break;
    case 'torch': if (stream) { torchOn = !torchOn; try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: torchOn }] }); } catch (err) { toast('Lampu tidak bisa dinyalakan.'); } } break;
    case 'pickclose': closeTop(); break;
    case 'pickname': pickName(t.dataset.n); break;
    case 'picknew': { const n = clean(t.dataset.n); if (n && await saveWorkers([...S.pekerja, { n, d: '' }])) pickName(n); break; }
    /* riwayat */
    case 'rwopen': S.rwDate = t.dataset.tgl; render(); loadAll(true); break;
    case 'rwback': S.rwDate = null; render(); loadRingkasan(); break;
    case 'print': printDay(); break;
    case 'export': exportXlsx(); break;
    case 'arsip':
      try { const j = await api('arsipkan', { tgl: S.rwDate }); toast('Diarsipkan: ' + j.jumlah + ' catatan.'); S.rwDate = null; render(); loadRingkasan(); loadAll(true); }
      catch (err) { toast(err.message || (err.code === 'network' ? 'Tidak ada sinyal.' : 'Gagal mengarsipkan.')); }
      break;
    /* pekerja */
    case 'addname': { const n = $('#newName'), d = $('#newDept'), v = clean(n.value); if (v) { if (await saveWorkers([...S.pekerja, { n: v, d: d.value }])) { n.value = ''; toast('Pekerja ditambahkan.'); } } else toast('Isi nama pekerja.'); break; }
    case 'doimport': {
      const items = parseImport(val('importText'));
      if (!items.length) { toast('Tidak ada baris yang bisa dibaca.'); break; }
      const before = S.pekerja.length;
      if (await saveWorkers([...S.pekerja, ...items])) { $('#importText').value = ''; $('#importInfo').textContent = ''; toast((S.pekerja.length - before) + ' pekerja baru ditambahkan.'); }
      break;
    }
    case 'delname': {
      const key = 'n:' + t.dataset.n;
      if (S.confirmDel === key) { S.confirmDel = null; if (await saveWorkers(S.pekerja.filter(p => p.n !== t.dataset.n))) toast('Dihapus dari daftar. Riwayat lamanya tetap tersimpan.'); }
      else armConfirm(key);
      break;
    }
  }
});

document.addEventListener('submit', async e => {
  const id = e.target.id;
  if (id === 'pinForm') {
    e.preventDefault();
    const pin = clean($('#pinInput').value), btn = $('#pinBtn');
    if (!/^\d{6}$/.test(pin)) { showPin('PIN terdiri dari 6 angka.'); return; }
    btn.disabled = true;
    try {
      const r = await doLogin(pin);
      if (r.ok) { $('#pin').hidden = true; $('#pinInput').value = ''; $('#pinErr').hidden = true; S.loadError = null; lsSet('qrg.hadTok', true); loadAll(); flush(); }
      else if (r.error === 'kunci') { $('#pinInput').value = ''; showPin('Terlalu banyak salah. Coba lagi dalam ' + r.menit + ' menit.'); }
      else { $('#pinInput').value = ''; showPin('PIN salah. Sisa percobaan: ' + (r.sisa ?? '?') + '.'); }
    } catch (err) { showPin(err.code === 'network' ? 'Tidak ada sinyal. Coba lagi.' : 'Server tidak menjawab. Coba lagi.'); }
    btn.disabled = false;
  } else if (id === 'maintForm') {
    e.preventDefault();
    const tgl = val('mDate'), next = val('mNext'), oleh = clean(val('mOleh'));
    if (!tgl) { toast('Isi tanggal maintenance.'); return; }
    lsSet('qrg.mOleh', oleh);
    const u = U[S.kode], jid = u ? u.j : '', cols = skemaFor(jid), data = {};
    cols.forEach(f => {
      const el = $('#mx_' + f.id); if (!el) return;
      if (f.tipe === 'centang') { if (el.checked) data[f.id] = true; }
      else { const v = clean(el.value); if (v) data[f.id] = v; }
    });
    const lampiran = clean(val('mPdf'));
    enqueue('addMaintenance', { id: uid(), kode: S.kode, tgl, jenis: val('mJenis'), oleh, cat: val('mCat').trim(), next, data, lampiran });
    $('#maintForm').hidden = true; $('#maintOpenBtn').hidden = false; $('#mCat').value = ''; $('#mNext').value = ''; $('#mPdf').value = '';
    cols.forEach(f => { const el = $('#mx_' + f.id); if (el) { if (f.tipe === 'centang') el.checked = false; else el.value = ''; } });
    renderLive(); toast('Maintenance dicatat.');
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q') { S.q = e.target.value; renderJlist(true); }
  else if (id === 'pq') { S.tq = e.target.value; renderTempatList(); }
  else if (id === 'mq') { S.mqq = e.target.value; renderMatList(); }
  else if (id === 'aq') { if (S.form) { S.form.q = e.target.value; renderTambahTempat(); } }
  else if (id === 'stokJ') { if (S.stokEd) { S.stokEd.jumlah = e.target.value; stokPreview(); } }
  else if (id === 'stokC') { if (S.stokEd) S.stokEd.cat = e.target.value; }
  else if (id === 'cropZoom') { if (S.fotoEd) { S.fotoEd.zoom = Number(e.target.value); drawCrop(); } }
  else if (id === 'tq') { S.form.q = e.target.value; const q = norm(e.target.value); $('#tlist').innerHTML = tambahList(S.jenis.filter(j => !q || norm([j.n, j.b, j.m].join(' ')).includes(q)).sort((a, b) => byName(a.n, b.n) || byName(a.b, b.b))); }
  else if (id === 'pickq') { S.picker.q = e.target.value; fillPicker(); }
  else if (id === 'pinInput') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  else if (id === 'tawalan' || id === 'jawalan') { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3); updateCodePrev(); }
  else if (id === 'importText') { const n = parseImport(e.target.value).length; $('#importInfo').textContent = n ? n + ' baris terbaca.' : ''; }
  else if (id === 'mrekNew') {
    const v = norm(e.target.value), from = e.target.dataset.from, other = merekList().find(m => norm(m.name) === v && norm(m.name) !== norm(from));
    $('#mrekNote').textContent = other ? 'Sudah ada merek “' + other.name + '”. Kedua merek akan digabung.' : '“' + from + '” akan diganti di semua jenis yang memakainya.';
  }
});
document.addEventListener('change', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'impFile') { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) impLoad(f); return; }
  if (id === 'irFile') { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) irLoad(f); return; }
  if (id === 'fiFile') { const fs = e.target.files; e.target.value = ''; if (fs && fs.length) fiPicked(fs); return; }
  if (id === 'fileCam' || id === 'fileGal') { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) fotoPicked(f); return; }
  if (id === 'tkat') { $('#tkatBox').hidden = v !== '__new'; updateCodePrev(); }
  else if (id === 'jkat') $('#jkatBox').hidden = v !== '__new';
  else if (id === 'tmerek') $('#tmerekBox').hidden = v !== '__new';
  else if (id === 'jmerek') $('#jmerekBox').hidden = v !== '__new';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newName') { e.preventDefault(); const b = document.querySelector('[data-action="addname"]'); if (b) b.click(); }
});

/* ---------- hash (stiker lama: #BOR-014) dan siklus aplikasi ---------- */
function codeFromHash() {
  const h = decodeURIComponent((location.hash || '').slice(1)).toUpperCase();
  return /^(?:[A-Z]{3}|LOK|MAT)-\d{3}$/.test(h) ? h : '';
}
function openCode(k) {
  if (isLok(k)) { if (T[k]) go('tempat', { tid: k }); else toast(k + ' tidak ada di daftar.'); }
  else if (/^MAT-/.test(k)) { if (M[k]) go('mat', { mid: k }); else toast(k + ' tidak ada di daftar.'); }
  else if (U[k]) openUnit(k); else toast(k + ' tidak ada di daftar.');
}
window.addEventListener('hashchange', () => { const k = codeFromHash(); if (k) { history.replaceState(history.state, '', URL_); openCode(k); } });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (S.scan) stopCamera(); }
  else { flush(); loadAll(true); if (S.scan && !S.scan.done) startCamera(); }
});
window.addEventListener('online', () => { flush(); loadAll(true); });

/* ---------- layar lebar: menu samping tetap terlihat ---------- */
function applyPinned(init) {
  S.pinned = isWide(); document.body.classList.toggle('pinned', S.pinned);
  const d = $('#drawer');
  if (S.pinned) { if (S.ov.includes('drawer')) S.ov.splice(S.ov.indexOf('drawer'), 1); renderDrawer(); d.hidden = false; }
  else if (!S.ov.includes('drawer')) d.hidden = true;
  if (!init) renderChrome();
}

/* ---------- mulai ---------- */
(function start() {
  document.documentElement.lang = LANG.cur;
  setupLangObserver();
  const c = lsGet('qrg.c3', null);
  if (c && c.jenis) applyData(c);
  const k = codeFromHash();
  if (k) { if (isLok(k)) { S.view = 'tempat'; S.tid = k; } else if (/^MAT-/.test(k)) { S.view = 'mat'; S.mid = k; } else { S.view = 'profil'; S.kode = k; } }
  applyPinned(true);
  history.replaceState({ ...curState(), d: 0 }, '', URL_);
  render();
  if (!S.tok && API_URL && !API_URL.includes('PASTE')) showPin(); else loadAll();
  flush();
  setInterval(() => { if (document.hidden || Q.busy || Busy.n) return; if (['nama', 'jenis', 'profil', 'hari', 'riwayat', 'tempat', 'tempatlist', 'material', 'mat'].includes(S.view) || S.scan) loadAll(true); }, 20000);
  window.matchMedia('(min-width: 1000px)').addEventListener('change', () => { applyPinned(); render(); });
  setInterval(flush, 25000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
